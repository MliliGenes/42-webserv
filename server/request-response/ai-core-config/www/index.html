<!DOCTYPE html>
<html>
<head>
    <title>Webserv Test</title>
</head>
<body>
    <h1>Welcome to Webserv</h1>

    <h2>Upload File</h2>
    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="file" name="file">
        <button type="submit">Upload</button>
    </form>

    <h2>Test CGI (Python)</h2>
    <form action="/cgi-bin/echo.py" method="POST">
        <input type="text" name="name" placeholder="Your name">
        <button type="submit">Send</button>
    </form>

    <h2>Links</h2>
    <ul>
        <li><a href="/images/">Autoindex (images)</a></li>
        <li><a href="/redirect">Redirect test</a></li>
        <li><a href="/cgi-bin/session.py">CGI GET test</a></li>
    </ul>
</body>
</html>
